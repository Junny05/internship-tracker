server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: internship-tracker
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:internship_tracker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # Must be set via env var in any real deployment - never commit a real secret.
    # HS256 requires a key of at least 256 bits (32 bytes).
    secret: ${JWT_SECRET:this-is-a-dev-only-default-secret-change-me-32bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
