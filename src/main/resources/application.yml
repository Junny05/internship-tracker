server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: internship-tracker
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:internship_tracker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    # Must be set via env var in any real deployment - never commit a real secret.
    # HS256 requires a key of at least 256 bits (32 bytes).
    secret: ${JWT_SECRET:this-is-a-dev-only-default-secret-change-me-32bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  mail:
    # Sender address for job alert emails - must be a real address the SMTP account can send as.
    from: ${MAIL_FROM:no-reply@internship-tracker.local}
  job-alerts:
    # How often (ms) to poll saved searches for new listings. Default: 6 hours.
    # Keep this generous - free-tier job search APIs have low monthly call limits.
    poll-interval-ms: ${JOB_ALERT_POLL_INTERVAL_MS:21600000}
  adzuna:
    # Free API credentials from https://developer.adzuna.com/ - required for job alerts to work.
    app-id: ${ADZUNA_APP_ID:}
    app-key: ${ADZUNA_APP_KEY:}
    country: ${ADZUNA_COUNTRY:us}
