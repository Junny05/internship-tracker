spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 3025
    username: test
    password: test

management:
  health:
    # Actuator's mail health contributor fails to initialize when JavaMailSender
    # is @MockBean'd (JobAlertIntegrationTest) - not meaningful in tests anyway.
    mail:
      enabled: false

app:
  jwt:
    secret: test-only-secret-key-do-not-use-in-prod-32bytes
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173
  mail:
    from: test@example.com
  job-alerts:
    poll-interval-ms: 999999999
  adzuna:
    base-url: http://localhost:0
    app-id: ""
    app-key: ""
    country: us
